services:
  # 1. PostPilot Next.js 15 Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postpilot-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - MONGODB_URI=mongodb://mongodb:27017/postpilot
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=postpilot-dev-jwt-super-secret-key-32-chars-minimum
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - BLUESKY_SERVICE_URL=https://bsky.social
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - postpilot-network

  # 2. PostPilot Background Queue & Publishing Worker Daemon
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postpilot-worker
    restart: always
    command: ["node", "-r", "ts-node/register", "src/workers/publisherWorker.ts"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/postpilot
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=postpilot-dev-jwt-super-secret-key-32-chars-minimum
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - BLUESKY_SERVICE_URL=https://bsky.social
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - postpilot-network

  # 3. Persistent MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: postpilot-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postpilot-network

  # 4. Redis Cache & BullMQ Queue Store
  redis:
    image: redis:7-alpine
    container_name: postpilot-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postpilot-network

volumes:
  mongo-data:
  redis-data:

networks:
  postpilot-network:
    driver: bridge
