<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Wing Left Gradient -->
    <linearGradient id="wingLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Wing Right Gradient -->
    <linearGradient id="wingRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Underside Fold Gradient -->
    <linearGradient id="underGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Keel / Central Spine Gradient -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Signal Arc Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Thruster Trail Gradient -->
    <linearGradient id="thrustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  <rect width="1016" height="1016" x="4" y="4" rx="220" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="512" cy="480" r="460" fill="url(#centerGlow)"/>

  <!-- Social Media Broadcast Waves -->
  <g stroke="url(#arcGrad)" stroke-linecap="round" fill="none">
    <path d="M 420 290 A 280 280 0 0 1 780 650" stroke-width="14" opacity="0.85"/>
    <path d="M 470 370 A 180 180 0 0 1 700 600" stroke-width="12" opacity="0.9"/>
    <path d="M 260 440 A 380 380 0 0 1 640 820" stroke-width="10" opacity="0.45"/>
  </g>

  <!-- Supersonic Thruster Trails -->
  <g stroke="url(#thrustGrad)" stroke-linecap="round">
    <line x1="240" y1="730" x2="130" y2="840" stroke-width="16" opacity="0.5"/>
    <line x1="350" y1="770" x2="230" y2="890" stroke-width="18" opacity="0.7"/>
    <line x1="440" y1="810" x2="350" y2="900" stroke-width="14" opacity="0.5"/>
  </g>

  <!-- The PostPilot Supersonic Origami Jet -->
  <g>
    <!-- Left Wing -->
    <polygon points="820,210 250,510 460,596" fill="url(#wingLeftGrad)"/>

    <!-- Underside Fold Core -->
    <polygon points="460,596 510,720 560,610" fill="url(#underGrad)"/>

    <!-- Right Wing Main Facet -->
    <polygon points="820,210 460,596 710,730" fill="url(#wingRightGrad)"/>

    <!-- Wing Flap Shadow Depth -->
    <polygon points="820,210 710,730 620,580" fill="#6b21a8" opacity="0.45"/>

    <!-- Central Fuselage Spine / Precision Fold -->
    <polygon points="820,210 530,560 460,596" fill="url(#spineGrad)"/>

    <!-- Outer Structural Highlights -->
    <polyline points="250,510 820,210 710,730" fill="none" stroke="#f0f9ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <line x1="820" y1="210" x2="460" y2="596" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>

    <!-- Glowing Pilot Beacon Spark -->
    <circle cx="820" cy="210" r="28" fill="#38bdf8" opacity="0.35"/>
    <circle cx="820" cy="210" r="18" fill="#e0f2fe" opacity="0.8"/>
    <circle cx="820" cy="210" r="10" fill="#ffffff"/>
  </g>
</svg>
